{% extends "base.html" %}

{% block title %}Add server · Server monitor{% endblock %}

{% block content %}
  <h1 class="page-title">Add server</h1>
  <p class="page-lead">Linux hosts for this local demo. Nothing is saved.</p>

  {% if notice %}
  <div class="sample-note" role="status">{{ notice }}</div>
  {% endif %}

  <form class="form-card" method="post" action="{{ url_for('add_server_submit') }}">
    <div class="mb-3">
      <label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" name="name" autocomplete="off">
    </div>
    <div class="mb-3">
      <label class="form-label" for="host">Host</label>
      <input class="form-control" id="host" name="host" autocomplete="off" placeholder="127.0.0.1">
    </div>
    <button class="btn btn-add" type="submit">Add server</button>
  </form>
{% endblock %}
